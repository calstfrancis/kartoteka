[workspace]
resolver = "2"
members = [
    "crates/fond-bib",
    "crates/fond-vault",
    "crates/fond-doc",
    "crates/fond-index",
    "kartoteka-cli",
    "kartoteka-ui-gtk",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
authors = ["Cal St Francis <calstfrancis@gmail.com>"]
repository = "https://github.com/calstfrancis/kartoteka"

# Shared dependency versions. Only Milestone 1 dependencies are declared here; PDF,
# tantivy, and network crates are added at their milestones (see docs/ROADMAP.md).
[workspace.dependencies]
hayagriva = "0.10"
biblatex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "https"] }
rusqlite = { version = "0.40", features = ["bundled"] }
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "thread_safe", "sync"] }
tantivy = "0.24"
blake3 = "1"
walkdir = "2"
directories = "5"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
notify = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
keyring = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"

# fond-read-gtk (extracted into github.com/calstfrancis/pereplyot, 2026-09-15) pulls
# fond-bib/fond-doc from this repo over git — without this patch, Cargo treats that git
# checkout's fond-bib/fond-doc as a *different* crate from kartoteka-ui-gtk's own local
# path dependency on the same two crates (same content, different SourceId), producing
# "expected fond_bib::Progress, found fond_bib::Progress" type-mismatch errors at any call
# site that crosses the fond-read-gtk boundary. Patching pereplyot's transitive kartoteka
# git dependency back onto these local paths unifies them into one crate instance.
[patch."https://github.com/calstfrancis/kartoteka"]
fond-bib = { path = "crates/fond-bib" }
fond-doc = { path = "crates/fond-doc" }
