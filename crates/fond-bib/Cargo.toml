[package]
name = "fond-bib"
version = "0.1.0"
description = "Hayagriva bibliography model, on-disk vault layout, citation keys — shared Fond crate"
license = "MIT"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
hayagriva.workspace = true
biblatex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
serde_json.workspace = true
blake3.workspace = true
walkdir.workspace = true
thiserror.workspace = true
reqwest = { workspace = true, optional = true }

[features]
# Network acquisition (DOI/ISBN/arXiv lookup). Off by default so lean consumers of
# fond-bib (e.g. Zerkalo) don't pull in reqwest/tokio.
acquire = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3"
rusqlite = { workspace = true }
blake3 = { workspace = true }
