[package]
name = "kartoteka-cli"
version = "0.5.0"
description = "Kartoteka — headless reference manager and PDF library (proprietary)"
license = "LicenseRef-Proprietary"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "kartoteka"
path = "src/main.rs"

[dependencies]
fond-bib = { path = "../crates/fond-bib", features = ["acquire"] }
fond-vault = { path = "../crates/fond-vault" }
fond-doc = { path = "../crates/fond-doc" }
fond-index = { path = "../crates/fond-index" }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
