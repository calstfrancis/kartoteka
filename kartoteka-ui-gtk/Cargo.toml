[package]
name = "kartoteka-ui-gtk"
version = "0.5.0"
description = "Kartoteka — Linux GTK4/libadwaita frontend (proprietary)"
license = "LicenseRef-Proprietary"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "kartoteka-gtk"
path = "src/main.rs"

[dependencies]
fond-bib = { path = "../crates/fond-bib", features = ["acquire"] }
fond-index = { path = "../crates/fond-index" }
fond-doc = { path = "../crates/fond-doc" }
fond-vault = { path = "../crates/fond-vault" }
gtk4 = { version = "0.7", features = ["v4_10"] }
libadwaita = { version = "0.5", features = ["v1_4"] }
glib = "0.18"
# EPUB chapter rendering (M5-SPEC.md 5B). GTK-specific, so it lives here rather than in
# fond-doc, which stays UI-agnostic (ARCHITECTURE.md — no GTK/Tauri types in the shared
# crates). Pinned to the 0.2 series, the one that matches this crate's gtk4 0.7/glib 0.18/
# libadwaita 0.5 — newer webkit6 releases pull gtk4 0.11+, a much larger bump not worth
# taking just for this.
webkit6 = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }
reqwest = { workspace = true }
keyring = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
