[package]
name = "kartoteka-ui-gtk"
version = "0.12.0"
description = "Kartoteka — Linux GTK4/libadwaita frontend (proprietary)"
license = "LicenseRef-Proprietary"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "kartoteka-gtk"
path = "src/main.rs"

[dependencies]
fond-bib = { path = "../crates/fond-bib", features = ["acquire"] }
fond-index = { path = "../crates/fond-index" }
fond-doc = { path = "../crates/fond-doc" }
fond-read-gtk = { path = "../crates/fond-read-gtk" }
fond-vault = { path = "../crates/fond-vault" }
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_4"] }
glib = "0.22"
# EPUB chapter rendering (M5-SPEC.md 5B). GTK-specific, so it lives here rather than in
# fond-doc, which stays UI-agnostic (ARCHITECTURE.md — no GTK/Tauri types in the shared
# crates). webkit6 0.6 is the series matching this crate's gtk4 0.11/glib 0.22 — the four
# versions above move as one set and cannot be bumped independently.
webkit6 = "0.6"
# Main-thread handoff for worker threads (src/ui/worker.rs), replacing the
# `glib::MainContext::channel` removed in glib 0.19. Already in the tree via gio's
# `blocking`, so this is a direct dependency on something already being built.
async-channel = "2"
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }
reqwest = { workspace = true }
keyring = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
