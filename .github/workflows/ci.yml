name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  version-consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check version / metainfo consistency
        run: ./check-versions.sh

  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK4/libadwaita/WebKitGTK dev packages (Linux)
        # kartoteka-ui-gtk and fond-read-gtk (gtk4 + libadwaita + webkit6) are Linux-only —
        # their build scripts link against these via pkg-config, which was never installed
        # on the runner, so every Clippy/Test step here had been failing since the very
        # first CI run. The other workspace members (fond-bib, fond-doc, fond-index,
        # fond-vault, kartoteka-cli) are plain cross-platform Rust and don't need this.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (Linux, full workspace)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (Windows, excluding the Linux-only GTK crates)
        # Both GTK crates must be excluded, not just the app: fond-read-gtk (the shared
        # reader, extracted from kartoteka-ui-gtk in 0.12.1) pulls glib-sys/gobject-sys,
        # whose build scripts need pkg-config and GTK dev libraries the Windows runner has
        # no way to provide. Adding a GTK crate to this workspace means adding it here.
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --exclude kartoteka-ui-gtk --exclude fond-read-gtk --all-targets -- -D warnings
      - name: Fetch PDFium (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/pdfium"
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz \
            | tar -xz -C "$HOME/pdfium"
          echo "PDFIUM_LIB_PATH=$HOME/pdfium/lib" >> "$GITHUB_ENV"
      - name: Fetch PDFium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -fsSL -o pdfium.tgz https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz
          mkdir pdfium; tar -xzf pdfium.tgz -C pdfium
          echo "PDFIUM_LIB_PATH=$PWD\pdfium\bin" >> $env:GITHUB_ENV
      - name: Test (Linux, full workspace)
        if: runner.os == 'Linux'
        run: cargo test --workspace
      - name: Test (Windows, excluding the Linux-only GTK crates)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude kartoteka-ui-gtk --exclude fond-read-gtk
      - name: Test (acquire feature)
        run: cargo test -p fond-bib --features acquire
