name: Release flatpak

# Triggers on the same tag pattern the release process uses, plus a manual dispatch for
# testing this workflow itself without cutting a real version tag. Mirrors Zerkalo's
# release-flatpak.yml (zerkalo/.github/workflows/release-flatpak.yml) — the same shape,
# adapted for Kartoteka's manifest/app-id and its two-OS CI matrix.
# Requires three repo secrets that only Cal can set up (see RELEASE-CI-SETUP.md):
#   FLATPAK_GPG_PRIVATE_KEY — armored export of the signing key
#   FLATPAK_GPG_PASSPHRASE  — the signing key's passphrase
#   FLATPAK_REPO_TOKEN      — a token with push access to calstfrancis/flatpak
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match kartoteka-ui-gtk/Cargo.toml, e.g. 0.6.0)"
        required: true

# Least privilege for the workflow's own token: it only reads the repo and CI check-runs.
# Publishing uses the separate FLATPAK_REPO_TOKEN secret, not this token.
permissions:
  contents: read
  checks: read

jobs:
  publish-flatpak:
    runs-on: ubuntu-24.04
    # `bash -e -o pipefail` (the default `bash -e` has no pipefail), so a failure on the left
    # of a pipe such as `echo "$KEY" | gpg --import` fails the step instead of vanishing.
    defaults:
      run:
        shell: bash
    # Generous headroom: up to 15 min just waiting on ci.yml (see the polling loop below),
    # plus the actual build — without leaving a hang to run for GitHub's 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Structural version of a check CLAUDE.md used to ask Cal to remember to do by hand:
      # don't publish a build from a commit whose own CI run didn't pass. ci.yml's single
      # `build & test` job runs on a 2-OS matrix, which GitHub reports as two separately-named
      # check-runs — both must succeed, not just the Linux one the flatpak build itself
      # actually uses, since a Windows-only test failure is still a real regression worth
      # blocking a release over. Also requires `version-consistency`. Not skipped on manual
      # dispatch, which signs and publishes too.
      - name: Require CI to have passed for this commit
        # Applies to manual dispatch too: a dispatch still signs and publishes, so it must
        # not be a way around the gate.
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # publish-flatpak.sh pushes main and the tag back to back, and ci.yml triggers off
          # the main push — so ci.yml is often still running (conclusion "") when this step
          # first checks, not actually failed. Poll instead of checking once: up to 60
          # attempts, 15s apart (15 minutes).
          #
          # Every job ci.yml defines must succeed, including version-consistency (the guard
          # against metainfo/version drift). The newest run of each name wins: a re-run leaves
          # an older run of the same name behind, and a stale failure (or stale success) must
          # not decide the outcome. --paginate --slurp so more than one page of check-runs
          # can't hide the job we want.
          for JOB in "build & test (ubuntu-latest)" "build & test (windows-latest)" "version-consistency"; do
            CONCLUSION=""
            for attempt in $(seq 1 60); do
              CONCLUSION=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                | jq -r --arg job "$JOB" \
                  '[.[].check_runs[] | select(.name == $job)] | sort_by(.started_at) | last | .conclusion // ""')
              if [[ -n "$CONCLUSION" ]]; then
                break
              fi
              echo "ci.yml '$JOB' for $SHA hasn't finished yet (attempt $attempt/60) — waiting..."
              sleep 15
            done
            if [[ "$CONCLUSION" != "success" ]]; then
              echo "ERROR: ci.yml's '$JOB' job for commit $SHA is '${CONCLUSION:-missing}', not 'success' — refusing to publish."
              exit 1
            fi
            echo "ci.yml '$JOB' for $SHA: $CONCLUSION"
          done

      # Mirrors publish-flatpak.sh's own sanity check.
      - name: Verify version matches kartoteka-ui-gtk/Cargo.toml
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          VERSION="$INPUT_VERSION"
          if [[ -z "$VERSION" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Read `version` from the [package] table only, not the first line that happens to
          # start with "version" (a reordered Cargo.toml would otherwise yield the wrong one).
          CARGO_VERSION=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/^version *= *"|"$/,""); print; exit}' kartoteka-ui-gtk/Cargo.toml)
          if [[ -z "$CARGO_VERSION" ]]; then
            echo "ERROR: could not read the [package] version from kartoteka-ui-gtk/Cargo.toml."
            exit 1
          fi
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "ERROR: kartoteka-ui-gtk/Cargo.toml says version is '$CARGO_VERSION', but this run is for '$VERSION'."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install flatpak and flatpak-builder
        # Ubuntu 24.04 runners silently hang here otherwise: needrestart intercepts apt
        # installs that touch certain libraries and prompts interactively for which
        # services to restart, even with `apt-get install -y` — there's nothing to answer
        # that prompt in CI, so the step just sits forever with no error and no log output.
        # NEEDRESTART_MODE=a (automatic, no prompt) is the documented fix.
        #
        # Separately, Azure's mirror for Ubuntu's noble-security pocket periodically hangs
        # fetching InRelease with no timeout — apt has no default network timeout, so a
        # stalled TCP connection there also sits forever with no error. Acquire::Retries/
        # Acquire::http(s)::Timeout bound each attempt (~20s) and retry a few times, so a
        # bad mirror fails fast and gets retried instead of hanging the whole job.
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # The runner ships a preinstalled Google Chrome apt source that has been
          # serving a Packages.gz whose hash does not match its Release file, which
          # fails `apt-get update` outright — nothing to do with this project, and it
          # blocked a release. We need only Ubuntu's own archives here, so drop it.
          # Matched by content, not filename: runners use both the old .list form and
          # the deb822 .sources form, and removing only one of them missed it.
          # (`|| true`: with pipefail on, grep finding no match — exit 1 — must not fail this.)
          { sudo grep -rlE 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true; } \
            | xargs -r sudo rm -f
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y $APT_OPTS flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Determine runtime/extension versions
        # org.freedesktop.Sdk.Extension.rust-stable is versioned against the Freedesktop SDK
        # release GNOME's runtime pairs with, not the GNOME runtime number itself. GNOME
        # Platform/Sdk 50 pairs with Freedesktop SDK 25.08 (same mapping Zerkalo's identical
        # runtime-version '50' uses — see zerkalo/.github/workflows/release-flatpak.yml for
        # how this was confirmed). This mapping isn't derivable from the manifest, which
        # never states it, so it'll need updating by hand if runtime-version ever moves.
        run: |
          RUNTIME_VERSION=$(grep '^runtime-version' packaging/io.github.calstfrancis.Kartoteka.yml | sed "s/runtime-version: *'\(.*\)'/\1/")
          echo "RUNTIME_VERSION=$RUNTIME_VERSION" >> "$GITHUB_ENV"
          echo "RUST_EXTENSION_BRANCH=25.08" >> "$GITHUB_ENV"

      # Flathub's CDN has repeatedly 404'd on the same static-delta object partway through
      # this pull, specifically from GitHub-hosted runners (reproduces every time from here,
      # while the same ref pulls fine locally) — not a one-off blip, a systemic network-path
      # issue (same failure independently confirmed in Zerkalo's identical step — see
      # zerkalo/.github/workflows/release-flatpak.yml). Caching the installed --user flatpak
      # dir sidesteps it entirely after the first successful install: once the cache is warm,
      # the `flatpak install` below finds everything already present and never touches the
      # network. Keyed on the runtime/extension versions so a bump invalidates it automatically.
      - name: Cache flatpak user installation
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-gnome${{ env.RUNTIME_VERSION }}-rust${{ env.RUST_EXTENSION_BRANCH }}-v1

      - name: Install runtime, SDK, and rust-stable extension
        run: |
          REFS=(
            "org.gnome.Platform//$RUNTIME_VERSION"
            "org.gnome.Sdk//$RUNTIME_VERSION"
            "org.freedesktop.Sdk.Extension.rust-stable//$RUST_EXTENSION_BRANCH"
          )
          # Cache hit: everything's already installed, this is a fast no-op with no network
          # traffic. Cache miss: falls through to the retry/no-static-deltas fallback for the
          # same CDN flakiness described above.
          for attempt in 1 2 3; do
            if flatpak install --user -y flathub "${REFS[@]}"; then
              exit 0
            fi
            echo "flatpak install attempt $attempt failed, retrying in 15s…"
            sleep 15
          done
          echo "Retrying once more with --no-static-deltas…"
          flatpak install --user -y --no-static-deltas flathub "${REFS[@]}"

      # Secrets are passed through `env:` and read as shell variables, never interpolated into
      # the script text — a passphrase containing `"`, `$` or a backtick would otherwise break
      # the step or be evaluated by the shell.
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      # The signing key has a passphrase, so importing it isn't enough — flatpak build-export
      # (via libostree, via GPGME) asks gpg-agent for a signature and gpg-agent will try to
      # prompt for that passphrase interactively, which has nothing to prompt on here and just
      # fails. Preset it into the agent's cache instead, once, up front — every later signing
      # operation in this job (build-export and build-update-repo, both keyed by the same
      # keygrip) then finds it already unlocked and never needs the passphrase again.
      - name: Preset GPG passphrase into the agent
        env:
          GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          KEYGRIP=$(gpg --with-colons --with-keygrip --list-secret-keys \
            A2918A9B43B199ADF9879F934AC9D5173DE4BC41 | awk -F: '/^grp/ {print $10; exit}')
          PRESET_BIN=""
          for candidate in "$(command -v gpg-preset-passphrase 2>/dev/null || true)" \
            /usr/lib/gnupg/gpg-preset-passphrase /usr/lib/gnupg2/gpg-preset-passphrase; do
            if [[ -x "$candidate" ]]; then
              PRESET_BIN="$candidate"
              break
            fi
          done
          if [[ -z "$PRESET_BIN" ]]; then
            echo "ERROR: gpg-preset-passphrase not found anywhere expected." >&2
            exit 1
          fi
          printf '%s\n' "$GPG_PASSPHRASE" | "$PRESET_BIN" --preset "$KEYGRIP"

      # The manifest's git source is `branch: main`, so flatpak-builder would clone whatever
      # main is *now* — not the commit the tag points at and CI just verified. A later push to
      # main during the CI wait, or re-running an old tag's workflow, would then ship untested
      # code under the old version number. Pin it to this exact commit for the build.
      - name: Pin the manifest to this exact commit
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MANIFEST=packaging/io.github.calstfrancis.Kartoteka.yml
          grep -q '^        branch: main$' "$MANIFEST" || { echo "ERROR: expected 'branch: main' in $MANIFEST"; exit 1; }
          sed -i "s/^        branch: main$/        commit: $SHA/" "$MANIFEST"
          grep -n 'commit:' "$MANIFEST"

      - name: Build flatpak
        run: |
          flatpak-builder --force-clean --user --install build-flatpak \
            packaging/io.github.calstfrancis.Kartoteka.yml

      - name: Clone public flatpak repo
        env:
          REPO_TOKEN: ${{ secrets.FLATPAK_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${REPO_TOKEN}@github.com/calstfrancis/flatpak" /tmp/flatpak-checkout

      - name: Export build into the repo
        run: |
          flatpak build-export \
            --gpg-sign=A2918A9B43B199ADF9879F934AC9D5173DE4BC41 \
            /tmp/flatpak-checkout \
            build-flatpak \
            master

      - name: Regenerate OSTree summary
        run: |
          flatpak build-update-repo \
            --gpg-sign=A2918A9B43B199ADF9879F934AC9D5173DE4BC41 \
            /tmp/flatpak-checkout

      # Same check publish-flatpak-local.sh runs: build-export silently produces an unsigned
      # commit if --gpg-sign is missing or the key is unavailable — catch that here rather
      # than let it surface later as a GPG failure on someone else's install.
      - name: Verify the commit actually got signed
        run: |
          set -euo pipefail
          APP_ID="io.github.calstfrancis.Kartoteka"
          COMMIT="$(cat "/tmp/flatpak-checkout/refs/heads/app/$APP_ID/x86_64/master")"
          if [[ ! -f "/tmp/flatpak-checkout/objects/${COMMIT:0:2}/${COMMIT:2}.commitmeta" ]]; then
            echo "ERROR: commit $COMMIT for $APP_ID carries no GPG signature."
            exit 1
          fi
          echo "Signature verified for $APP_ID"

      - name: Push flatpak repo
        run: |
          cd /tmp/flatpak-checkout
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Kartoteka $VERSION"
          git push origin main
